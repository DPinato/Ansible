
---
- name: Install Docker Engine and Docker Compose
  hosts: all
  become: true
  gather_facts: true

  vars:
    docker_compose_version: "v5.6.1"
    docker_compose_asset: "docker-compose-linux-aarch64"
    docker_compose_plugin_dir: "/usr/local/lib/docker/cli-plugins"
    docker_compose_plugin_path: "/usr/local/lib/docker/cli-plugins/docker-compose"
    docker_compose_download_path: "/tmp/docker-compose-linux-aarch64"

  tasks:
    - name: Ensure the OS is Debian-based
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
        fail_msg: "This playbook is intended for Debian-based systems."

    - name: Ensure the system is ARM64
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == "aarch64"
        fail_msg: "This playbook currently supports 64-bit ARM (aarch64) only."

    - name: Configure archived Bullseye security repository
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^deb\s+http://security\.debian\.org/debian-security\s+bullseye-security'
        replace: 'deb [check-valid-until=no] https://archive.debian.org/debian-security bullseye-security'
      when:
        - ansible_facts['distribution'] == "Debian"
        - ansible_facts['distribution_major_version'] == "11"

    - name: Update APT package lists
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker.io
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Docker CLI plugin directory
      ansible.builtin.file:
        path: "{{ docker_compose_plugin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Docker Compose binary and verify checksum
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/{{ docker_compose_asset }}"
        dest: "{{ docker_compose_download_path }}"
        checksum: "sha256:https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/checksums.txt"
        owner: root
        group: root
        mode: "0644"
      register: compose_download

    - name: Install Docker Compose CLI plugin
      ansible.builtin.copy:
        src: "{{ docker_compose_download_path }}"
        dest: "{{ docker_compose_plugin_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Docker Compose version
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false

    - name: Display Docker Compose version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"
