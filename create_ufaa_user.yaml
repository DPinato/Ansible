---
- name: Create ufaa user (User For Automated Actions)
  hosts: pi_hosts
  become: yes
  vars:
    new_username: ufaa
    new_password: "{{ 'StrongPassword123' | password_hash('sha512') }}"
  tasks:
    - name: Ensure the user exists
      ansible.builtin.user:
        name: "{{ new_username }}"
        password: "{{ new_password }}"
        shell: /bin/bash
        state: present
        create_home: yes

    - name: Add user to sudo group
      ansible.builtin.user:
        name: "{{ new_username }}"
        groups: sudo
        append: yes

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/home/{{ new_username }}/.ssh"
        state: directory
        owner: "{{ new_username }}"
        group: "{{ new_username }}"
        mode: '0700'

    - name: Generate SSH key pair for user
      community.crypto.openssh_keypair:
        path: "/home/{{ new_username }}/.ssh/id_rsa"
        owner: "{{ new_username }}"
        group: "{{ new_username }}"
        mode: '0600'
        type: rsa
        size: 2048
      register: ssh_key

    - name: Save public key to authorized_keys
      ansible.builtin.copy:
        content: "{{ ssh_key.public_key }}"
        dest: "/home/{{ new_username }}/.ssh/authorized_keys"
        owner: "{{ new_username }}"
        group: "{{ new_username }}"
        mode: '0600'